<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prince animation comparison</title>
    <style>
      body {
        margin: 16px;
        background: #171e28;
        color: #ffffdd;
        font: 15px monospace;
      }
      h1 {
        font-size: 19px;
      }
      label,
      button {
        margin-right: 16px;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Original Prince and equipment poses</h1>
    <p>
      Actual Phaser sprites and equipment graphics at 3× native size. Gun flashes are off to compare the clothing
      palette.
    </p>
    <label
      >Facing
      <select id="facing">
        <option value="1">Right</option>
        <option value="-1">Left</option>
      </select></label
    >
    <label>Animation time <input id="time" type="range" min="0" max="1.5" step="0.01" value="0.34" /></label>
    <label
      >Seconds <input id="seconds" type="number" min="0" max="1.5" step="0.01" value="0.34" style="width: 60px"
    /></label>
    <label
      >Gun pose
      <select id="gun-pose">
        <option value="firing">Holding</option>
        <option value="drawing">Drawing</option>
        <option value="holstering">Stowing</option>
      </select></label
    >
    <button id="animate">Animate</button>
    <p id="status">Loading native sprites…</p>
    <div id="preview"></div>
    <script>
      var PrinceJS = {
        ROOM_WIDTH: 320,
        ROOM_HEIGHT: 189,
        BLOCK_WIDTH: 32,
        BLOCK_HEIGHT: 63,
        Utils: { convertX: (x) => Math.floor((x * 320) / 140) }
      };
    </script>
    <script src="../lib/phaser.min.js"></script>
    <script src="../src/PrincePose.js"></script>
    <script src="../src/RangedWeapon.js"></script>
    <script src="../src/MinigunEffects.js"></script>
    <script src="../src/RocketLauncherEffects.js"></script>
    <script src="../src/TwinTorchesEffects.js"></script>
    <script src="../src/TwinTorches.js"></script>
    <script src="../src/Molotov.js"></script>
    <script src="../src/MolotovEffects.js"></script>
    <script src="../src/Whip.js"></script>
    <script src="../src/WhipEffects.js"></script>
    <script src="../src/JetpackEffects.js"></script>
    <script src="prince-animation-browser.js"></script>
  </body>
</html>
